name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=divinelydemonic&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=divinelydemonic&layout=compact&langs_count=6&hide_border=true&card_width=1000&bg_color=135deg,0B1020,111827,172554&title_color=93C5FD&text_color=C7D2FE&border_radius=16&custom_title=Languages%20I%20Build%20With
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Customize Top Languages Font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("profile/top-langs.svg")
          svg = path.read_text()

          svg = re.sub(
              r'font-size:\s*([0-9.]+)px',
              lambda m: f'font-size: {float(m.group(1)) * 0.75:.1f}px',
              svg
          )

          path.write_text(svg)
          PY

      - name: Commit Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub stats" || exit 0

          git push
